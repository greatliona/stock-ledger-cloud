<!doctype html>
<html><head><meta charset="utf-8"><style>
html,body { margin:0; padding:0; } iframe { display:block; width:100%; height:1px; border:0; }
</style></head><body>
<iframe id="ledger" title="股票帳本"></iframe>
<script>
const frame = document.getElementById("ledger");
let mounted = false, reply = null, loaded = false;
let activeRequestId = null;
let resizeObserver, pendingResize = 0, lastHeight = 0;
let themeObserver, activeHost, activeHostTheme, loginReady;
const themeColors = {
  dark: ["#141a20", "#e8edf0"], light: ["#f6f7f4", "#17211c"], redfish: ["#f4eddd", "#30261f"],
};
const includesTheme = theme => Object.hasOwn(themeColors, theme);
const hostScope = 'html[data-stock-ledger-theme]';
const fishScope = 'html[data-stock-ledger-theme="redfish"]';
const backgroundId = "ledger-background-preload-image";
const styleId = "stock-ledger-host-theme-style";
function getHost() {
  const embedding = window.frameElement;
  return embedding?.closest(".stApp") ? embedding.ownerDocument : null;
}
function applyHostTheme(host, theme, bg, ink) {
  installToolbarToggle(host);
  let style = host.getElementById(styleId);
  if (!style) {
    style = host.createElement("style");
    style.id = styleId;
    style.textContent = `
      ${hostScope} body { background: var(--ledger-host-bg); }
      ${hostScope} .stApp { background: var(--ledger-host-bg) !important; color: var(--ledger-host-ink); }
      ${hostScope} :is([data-testid="stAppViewContainer"], [data-testid="stMain"]) {
        background: transparent !important;
      }
      ${hostScope} [data-testid="stHeader"] {
        background: var(--ledger-host-bg) !important;
        color: var(--ledger-host-ink);
      }
      ${hostScope} [data-testid="stHeader"] button { color: var(--ledger-host-ink); }
      ${hostScope} [data-testid="stWidgetLabel"] p { color: var(--ledger-host-ink); }
      ${fishScope} body { isolation: isolate; }
      ${fishScope} .stApp { background: transparent !important; }
      ${fishScope} [data-testid="stHeader"] { background: rgba(244, 237, 221, .84) !important; }
      #${backgroundId} { display: none; }
      ${fishScope} #${backgroundId}[data-ready] {
        display: block; position: fixed; inset: 0; width: 100%; height: 100vh; height: 100svh;
        z-index: -1; pointer-events: none; object-fit: contain;
      }
    `;
    host.head.append(style);
  }
  // This style and the image belong to the outer document, so Streamlit
  // swapping the login component for the ledger does not remove either.
  const palette = style.sheet.cssRules[0].style;
  palette.setProperty("--ledger-host-bg", bg);
  palette.setProperty("--ledger-host-ink", ink);
  host.documentElement.dataset.stockLedgerTheme = theme;
}
function installToolbarToggle(host) {
  if (!host.querySelector || host.getElementById("ledger-toolbar-toggle")) return;
  const style = host.createElement("style");
  style.textContent = `
    html:not([data-ledger-toolbar-open]) [data-testid="stHeader"] { visibility:hidden !important; pointer-events:none !important; }
    html[data-ledger-toolbar-open] [data-testid="stHeader"] { visibility:visible !important; padding-right:52px !important; }
    #ledger-toolbar-toggle { position:fixed; top:8px; right:8px; z-index:2147483647; width:40px; height:40px; border:0; border-radius:8px; background:transparent; color:var(--ledger-host-ink, #777); font-size:26px; cursor:pointer; }
    #ledger-toolbar-toggle:focus-visible { outline:2px solid currentColor; }
  `;
  host.head.append(style);
  const button = host.createElement("button");
  button.id = "ledger-toolbar-toggle";
  button.type = "button";
  button.textContent = "⋯";
  const update = open => {
    host.documentElement.toggleAttribute("data-ledger-toolbar-open", open);
    button.setAttribute("aria-expanded", String(open));
    button.setAttribute("aria-label", open ? "收起工具列" : "展開工具列");
    button.title = open ? "收起工具列" : "展開工具列";
  };
  update(false);
  button.addEventListener("click", () => update(button.getAttribute("aria-expanded") !== "true"));
  button.addEventListener("keydown", event => { if (event.key === "Escape") { update(false); button.focus(); } });
  host.body.append(button);
}
function clearHostTheme() {
  if (activeHost) delete activeHost.documentElement.dataset.stockLedgerTheme;
  activeHost = activeHostTheme = null;
  frame.contentDocument?.documentElement?.removeAttribute("data-host-wallpaper");
}
function syncHostTheme() {
  const doc = frame.contentDocument;
  const root = doc?.documentElement;
  const theme = root?.dataset.theme;
  if (!includesTheme(theme) || activeHostTheme === theme) return;
  try {
    const host = getHost();
    if (!host) return;
    const palette = frame.contentWindow.getComputedStyle(root);
    root.removeAttribute("data-host-wallpaper");
    if (theme === "redfish") {
      const image = frame.contentWindow.getComputedStyle(doc.body, "::before").backgroundImage;
      const path = image.match(/^url\("(.*)"\)$/)?.[1];
      if (path) preloadBackground(host, path);
      else host.getElementById(backgroundId)?.remove();
      root.setAttribute("data-host-wallpaper", "");
    }
    applyHostTheme(host, theme, palette.getPropertyValue("--bg").trim(), palette.getPropertyValue("--ink").trim());
    activeHost = host;
    activeHostTheme = theme;
  } catch (_) {
    // If embedding restrictions prevent host styling, keep the local fallback.
    clearHostTheme();
  }
}
function observeTheme() {
  themeObserver?.disconnect();
  if (!mounted || !frame.contentDocument?.documentElement) return;
  themeObserver = new MutationObserver(syncHostTheme);
  themeObserver.observe(frame.contentDocument.documentElement, {
    attributes: true, attributeFilter: ["data-theme"]
  });
  syncHostTheme();
}
window.addEventListener("pagehide", () => {
  themeObserver?.disconnect();
  clearHostTheme();
});
window.addEventListener("pageshow", observeTheme);
function send(type, fields = {}) { parent.postMessage({isStreamlitMessage:true, type, ...fields}, "*"); }
function preloadBackground(host, path) {
  const url = new URL(path, window.location.href);
  if (url.origin !== window.location.origin) return null;
  const previous = host.getElementById(backgroundId);
  if (previous?.src === url.href) return previous;
  const image = host.createElement("img");
  image.id = backgroundId;
  image.alt = "";
  image.addEventListener("load", () => { image.dataset.ready = ""; }, {once:true});
  image.src = url.href;
  if (previous) previous.replaceWith(image);
  else host.body.append(image);
  return image;
}
async function prepareLogin(path, themeStorageKey) {
  try {
    const host = getHost();
    if (!host) return;
    let savedTheme;
    try { savedTheme = window.localStorage.getItem(themeStorageKey); } catch (_) {}
    const theme = includesTheme(savedTheme) ? savedTheme : "dark";
    applyHostTheme(host, theme, ...themeColors[theme]);
    const image = preloadBackground(host, path);
    if (image && theme === "redfish") {
      // Fail open on a broken or stalled public asset, never lock out login.
      let timer;
      try {
        await Promise.race([
          image.decode().then(() => { image.dataset.ready = ""; }),
          new Promise(resolve => { timer = setTimeout(resolve, 5000); }),
        ]);
      } finally { clearTimeout(timer); }
    }
  } catch (_) {}
}
function syncHeight() {
  pendingResize = 0;
  const doc = frame.contentDocument;
  if (!doc?.body) return;
  // Measure content, not documentElement.scrollHeight (which includes the old viewport).
  const height = Math.max(1, Math.ceil(Math.max(doc.body.getBoundingClientRect().height, doc.body.scrollHeight)));
  if (height === lastHeight) return;
  lastHeight = height;
  frame.style.height = height + "px";
  send("streamlit:setFrameHeight", {height});
}
function scheduleResize() {
  if (!pendingResize) pendingResize = requestAnimationFrame(syncHeight);
}
function deliver() {
  if (!loaded || !reply || reply.id !== activeRequestId) return;
  if (reply.phase === "accepted" || reply.phase === "running") {
    frame.contentWindow.postMessage({type:"ledger-us-quotes-progress", ...reply, phase:"accepted"}, "*");
    return;
  }
  frame.contentWindow.postMessage({type:"ledger-us-quotes-result", ...reply}, "*");
  activeRequestId = null;
}
frame.addEventListener("load", () => {
  if (!mounted) return;
  loaded = true;
  resizeObserver?.disconnect();
  observeTheme();
  frame.style.visibility = "";
  const doc = frame.contentDocument;
  if (doc?.body) {
    resizeObserver = new ResizeObserver(scheduleResize);
    resizeObserver.observe(doc.body);
    doc.addEventListener("load", scheduleResize, true);
    doc.fonts?.ready.then(scheduleResize);
  }
  scheduleResize();
  deliver();
});
window.addEventListener("resize", scheduleResize);
window.addEventListener("message", event => {
  if (event.source === parent && event.data?.type === "streamlit:render") {
    const args = event.data.args;
    if (typeof args.preloadBackground === "string") {
      if (!loginReady) loginReady = prepareLogin(args.preloadBackground, args.themeStorageKey)
        .then(() => send("streamlit:setComponentValue", {value:true, dataType:"json"}));
      frame.hidden = true;
      send("streamlit:setFrameHeight", {height:0});
      return;
    }
    reply = args.reply;
    if (!mounted) {
      mounted = true;
      frame.style.visibility = "hidden";
      frame.srcdoc = args.html;
    }
    else deliver();
    scheduleResize();
  } else if (event.source === frame.contentWindow && event.data?.type === "ledger-us-quotes-request") {
    const {id, symbols} = event.data;
    if (typeof id === "string" && Array.isArray(symbols) && symbols.length <= 50) {
      activeRequestId = id;
      frame.contentWindow.postMessage({type:"ledger-us-quotes-progress", id, phase:"bridge"}, "*");
      send("streamlit:setComponentValue", {value:{id, symbols}, dataType:"json"});
    }
  }
});
send("streamlit:componentReady", {apiVersion:1});
send("streamlit:setFrameHeight", {height:1});
</script></body></html>
