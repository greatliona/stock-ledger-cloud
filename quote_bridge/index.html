<!doctype html>
<html><head><meta charset="utf-8"><style>
html,body { margin:0; padding:0; } iframe { display:block; width:100%; height:1px; border:0; }
</style></head><body>
<iframe id="ledger" title="股票帳本"></iframe>
<script>
const frame = document.getElementById("ledger");
let mounted = false, reply = null, loaded = false;
let activeRequestId = null;
let resizeObserver, pendingResize = 0, lastHeight = 0;
let themeObserver, hostThemeStyle, hostThemeFrame, activeHostTheme;
const hostScope = '.stApp:has(iframe[data-ledger-theme])';
const fishScope = '.stApp:has(iframe[data-ledger-theme="redfish"])';
function clearHostTheme() {
  hostThemeFrame?.removeAttribute("data-ledger-theme");
  hostThemeStyle?.remove();
  hostThemeFrame = hostThemeStyle = activeHostTheme = null;
  frame.contentDocument?.documentElement?.removeAttribute("data-host-wallpaper");
}
function syncHostTheme() {
  const doc = frame.contentDocument;
  const root = doc?.documentElement;
  const theme = root?.dataset.theme;
  if (!["light", "dark", "redfish"].includes(theme)) {
    clearHostTheme();
    return;
  }
  try {
    const embedding = window.frameElement;
    const host = embedding?.ownerDocument;
    if (!embedding?.closest(".stApp") ||
        !host.defaultView.CSS.supports("selector(:has(iframe))")) return;
    if (hostThemeStyle?.isConnected && activeHostTheme === theme) return;
    const palette = frame.contentWindow.getComputedStyle(root);
    if (!hostThemeStyle?.isConnected) {
      hostThemeStyle = host.createElement("style");
      hostThemeStyle.textContent = `
      ${hostScope} { background: var(--ledger-host-bg) !important; }
      ${fishScope} { isolation: isolate; }
      ${fishScope}::before {
        content: ""; position: fixed; inset: 0; height: 100svh;
        z-index: -1; pointer-events: none;
        background-image: var(--ledger-fish-image, none);
        background-position: center; background-size: contain; background-repeat: no-repeat;
      }
      ${hostScope} :is([data-testid="stAppViewContainer"], [data-testid="stMain"]) {
        background: transparent !important;
      }
      ${hostScope} [data-testid="stHeader"] {
        background: var(--ledger-host-bg) !important;
        color: var(--ledger-host-ink);
      }
      ${fishScope} [data-testid="stHeader"] {
        background: rgba(244, 237, 221, .84) !important;
      }
      ${hostScope} [data-testid="stHeader"] button { color: var(--ledger-host-ink); }
      `;
      host.head.append(hostThemeStyle);
    }
    const hostPalette = hostThemeStyle.sheet.cssRules[0].style;
    hostPalette.setProperty("--ledger-host-bg", palette.getPropertyValue("--bg").trim());
    hostPalette.setProperty("--ledger-host-ink", palette.getPropertyValue("--ink").trim());
    // Computed image URL is absolute and retains Streamlit Cloud's proxy prefix.
    root.removeAttribute("data-host-wallpaper");
    const image = theme === "redfish"
      ? frame.contentWindow.getComputedStyle(doc.body, "::before").backgroundImage : "none";
    hostPalette.setProperty("--ledger-fish-image", image);
    hostThemeFrame = embedding;
    embedding.setAttribute("data-ledger-theme", theme);
    if (theme === "redfish") root.setAttribute("data-host-wallpaper", "");
    activeHostTheme = theme;
  } catch (_) {
    // If embedding restrictions prevent host styling, keep the local fallback.
    clearHostTheme();
  }
}
function observeTheme() {
  themeObserver?.disconnect();
  if (!frame.contentDocument?.documentElement) return;
  themeObserver = new MutationObserver(syncHostTheme);
  themeObserver.observe(frame.contentDocument.documentElement, {
    attributes: true, attributeFilter: ["data-theme"]
  });
  syncHostTheme();
}
window.addEventListener("pagehide", () => {
  themeObserver?.disconnect();
  clearHostTheme();
});
window.addEventListener("pageshow", observeTheme);
function send(type, fields = {}) { parent.postMessage({isStreamlitMessage:true, type, ...fields}, "*"); }
function preloadBackground(path) {
  const url = new URL(path, window.location.href);
  if (url.origin !== window.location.origin) return;
  let host = document;
  // Use the same document as the final fixed background. Keep the hidden
  // image during the component swap after login, even if the download is active.
  try { host = window.frameElement?.ownerDocument || document; } catch (_) {}
  const id = "ledger-background-preload-image";
  const previous = host.getElementById(id);
  if (previous?.src === url.href) return;
  const image = host.createElement("img");
  image.id = id;
  image.hidden = true;
  image.alt = "";
  image.src = url.href;
  if (previous) previous.replaceWith(image);
  else host.body.append(image);
}
function syncHeight() {
  pendingResize = 0;
  const doc = frame.contentDocument;
  if (!doc?.body) return;
  // Measure content, not documentElement.scrollHeight (which includes the old viewport).
  const height = Math.max(1, Math.ceil(Math.max(doc.body.getBoundingClientRect().height, doc.body.scrollHeight)));
  if (height === lastHeight) return;
  lastHeight = height;
  frame.style.height = height + "px";
  send("streamlit:setFrameHeight", {height});
}
function scheduleResize() {
  if (!pendingResize) pendingResize = requestAnimationFrame(syncHeight);
}
function deliver() {
  if (!loaded || !reply || reply.id !== activeRequestId) return;
  if (reply.phase === "accepted" || reply.phase === "running") {
    frame.contentWindow.postMessage({type:"ledger-us-quotes-progress", ...reply, phase:"accepted"}, "*");
    return;
  }
  frame.contentWindow.postMessage({type:"ledger-us-quotes-result", ...reply}, "*");
  activeRequestId = null;
}
frame.addEventListener("load", () => {
  loaded = true;
  resizeObserver?.disconnect();
  clearHostTheme();
  observeTheme();
  const doc = frame.contentDocument;
  if (doc?.body) {
    resizeObserver = new ResizeObserver(scheduleResize);
    resizeObserver.observe(doc.body);
    doc.addEventListener("load", scheduleResize, true);
    doc.fonts?.ready.then(scheduleResize);
  }
  scheduleResize();
  deliver();
});
window.addEventListener("resize", scheduleResize);
window.addEventListener("message", event => {
  if (event.source === parent && event.data?.type === "streamlit:render") {
    const args = event.data.args;
    if (typeof args.preloadBackground === "string") {
      preloadBackground(args.preloadBackground);
      frame.hidden = true;
      send("streamlit:setFrameHeight", {height:0});
      return;
    }
    reply = args.reply;
    if (!mounted) { mounted = true; frame.srcdoc = args.html; }
    else deliver();
    scheduleResize();
  } else if (event.source === frame.contentWindow && event.data?.type === "ledger-us-quotes-request") {
    const {id, symbols} = event.data;
    if (typeof id === "string" && Array.isArray(symbols) && symbols.length <= 50) {
      activeRequestId = id;
      frame.contentWindow.postMessage({type:"ledger-us-quotes-progress", id, phase:"bridge"}, "*");
      send("streamlit:setComponentValue", {value:{id, symbols}, dataType:"json"});
    }
  }
});
send("streamlit:componentReady", {apiVersion:1});
send("streamlit:setFrameHeight", {height:1});
</script></body></html>
