<!doctype html>
<html><head><meta charset="utf-8"><style>
html,body { margin:0; padding:0; } iframe { display:block; width:100%; height:1px; border:0; }
</style></head><body>
<iframe id="ledger" title="股票帳本"></iframe>
<script>
const frame = document.getElementById("ledger");
let mounted = false, reply = null, loaded = false;
let resizeObserver, pendingResize = 0, lastHeight = 0;
function send(type, fields = {}) { parent.postMessage({isStreamlitMessage:true, type, ...fields}, "*"); }
function syncHeight() {
  pendingResize = 0;
  const doc = frame.contentDocument;
  if (!doc?.body) return;
  // Measure content, not documentElement.scrollHeight (which includes the old viewport).
  const height = Math.max(1, Math.ceil(Math.max(doc.body.getBoundingClientRect().height, doc.body.scrollHeight)));
  if (height === lastHeight) return;
  lastHeight = height;
  frame.style.height = height + "px";
  send("streamlit:setFrameHeight", {height});
}
function scheduleResize() {
  if (!pendingResize) pendingResize = requestAnimationFrame(syncHeight);
}
function deliver() { if (loaded && reply) frame.contentWindow.postMessage({type:"ledger-us-quotes-result", ...reply}, "*"); }
frame.addEventListener("load", () => {
  loaded = true;
  resizeObserver?.disconnect();
  const doc = frame.contentDocument;
  if (doc?.body) {
    resizeObserver = new ResizeObserver(scheduleResize);
    resizeObserver.observe(doc.body);
    doc.addEventListener("load", scheduleResize, true);
    doc.fonts?.ready.then(scheduleResize);
  }
  scheduleResize();
  deliver();
});
window.addEventListener("resize", scheduleResize);
window.addEventListener("message", event => {
  if (event.source === parent && event.data?.type === "streamlit:render") {
    const args = event.data.args;
    reply = args.reply;
    if (!mounted) { mounted = true; frame.srcdoc = args.html; }
    else deliver();
    scheduleResize();
  } else if (event.source === frame.contentWindow && event.data?.type === "ledger-us-quotes-request") {
    const {id, symbols} = event.data;
    if (typeof id === "string" && Array.isArray(symbols) && symbols.length <= 50)
      send("streamlit:setComponentValue", {value:{id, symbols}, dataType:"json"});
  }
});
send("streamlit:componentReady", {apiVersion:1});
send("streamlit:setFrameHeight", {height:1});
</script></body></html>
